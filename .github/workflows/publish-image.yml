name: Publish verified EAP Java 7 image to GHCR
on:
  workflow_dispatch:
    inputs:
      base_image:
        description: 'Licensed EAP 6.4 / Java 7 base image with EAP at /opt/eap (prefer an immutable digest)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/release.yml
  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: memoharbor-legacy-ghcr
      cancel-in-progress: false
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-root-only
          MARIADB_DATABASE: apm_test
          MARIADB_USER: apm_test
          MARIADB_PASSWORD: ci-test-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      BASE_IMAGE: ${{ inputs.base_image }}
      EAP_REGISTRY: ${{ secrets.EAP_REGISTRY }}
      MARIADB_TEST_URL: jdbc:mariadb://127.0.0.1:3306/apm_test
      MARIADB_TEST_USER: apm_test
      MARIADB_TEST_PASSWORD: ci-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: memoharbor-legacy-war
          path: target
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Authenticate to private EAP base image registry
        if: env.EAP_REGISTRY != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.EAP_REGISTRY }}
          username: ${{ secrets.EAP_REGISTRY_USERNAME }}
          password: ${{ secrets.EAP_REGISTRY_PASSWORD }}
      - name: Build EAP Java 7 image
        shell: bash
        run: |
          set -euo pipefail
          : "${BASE_IMAGE:?An EAP 6.4 / Java 7 base image is required}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build --build-arg "EAP64_JAVA7_IMAGE=$BASE_IMAGE" --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$image:sha-$GITHUB_SHA" --tag "$image:java7" .
      - name: Verify arbitrary UID, MariaDB and restart before publishing
        run: bash scripts/verify-container.sh "$IMAGE:sha-$GITHUB_SHA"
      - name: Push verified image and report digest
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:java7"
          reference="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:sha-$GITHUB_SHA")"
          printf 'Published image: `%s`\n\nTags: `java7`, `sha-%s`\n' "$reference" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
