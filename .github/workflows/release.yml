name: Verify Java 7 legacy WAR
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-root-only
          MARIADB_DATABASE: apm_test
          MARIADB_USER: apm_test
          MARIADB_PASSWORD: ci-test-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MARIADB_TEST_URL: jdbc:mariadb://127.0.0.1:3306/apm_test
      MARIADB_TEST_USER: apm_test
      MARIADB_TEST_PASSWORD: ci-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '7'
      - name: Install Maven that runs on Java 7
        shell: bash
        run: |
          set -euo pipefail
          url=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.8.8/apache-maven-3.8.8-bin.tar.gz
          cd "$RUNNER_TEMP"
          curl --fail --location "$url" -o maven.tar.gz
          checksum=332088670d14fa9ff346e6858ca0acca304666596fec86eea89253bd496d3c90deae2be5091be199f48e09d46cec817c6419d5161fb4ee37871503f472765d00
          printf '%s  maven.tar.gz\n' "$checksum" | sha512sum --check -
          tar -xzf maven.tar.gz
          echo "$RUNNER_TEMP/apache-maven-3.8.8/bin" >> "$GITHUB_PATH"
      - name: Compile, test and verify Java 7 APIs
        run: mvn --batch-mode --no-transfer-progress -Dhttps.protocols=TLSv1.2 verify
      - name: Inspect every packaged class and dependency
        run: python3 scripts/verify-war.py target/memoharbor.war
      - uses: actions/upload-artifact@v4
        with:
          name: memoharbor-legacy-war
          path: target/memoharbor.war
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: memoharbor-legacy-war
          path: dist
      - name: Publish tested WAR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum memoharbor.war > SHA256SUMS
          gh release create "$TAG" memoharbor.war SHA256SUMS --verify-tag --title "MemoHarbor Legacy $TAG" --notes "Java 7 / Servlet 3.0 WAR targeting JBoss EAP 6.4. See VALIDATION.md for verified scope and limitations. EAP container and OpenShift cluster deployment require separate acceptance testing."
